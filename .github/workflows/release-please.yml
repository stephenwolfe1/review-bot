name: release-please

# On every merge to main, release-please keeps a release PR up to date: the
# next version (from conventional commit messages) and CHANGELOG.md. Merging
# that PR tags vX.Y.Z and creates the GitHub release; the jobs below then
# publish the image and binaries for that tag.
#
# release-please runs with a token from the release GitHub App (credentials
# in the "release" environment, which only main can use), so CI runs on its
# release PRs. Publishing stays in this workflow so it runs only after
# release-please reports a new release, against that exact tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    # The App token does the writing; GITHUB_TOKEN needs nothing here.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check

  image:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 -> 0.1.0, 0.1, latest
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
      # Go cross-compiles inside the Dockerfile, so no QEMU is needed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-please.outputs.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  binaries:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${TAG}" \
              -o "dist/review-bot_${os}_${arch}" ./cmd/review-bot
          done
          (cd dist && sha256sum review-bot_* > checksums.txt)
      # release-please already created the release; attach the binaries to it.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
